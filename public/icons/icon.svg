<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061120" />
      <stop offset="50%" stop-color="#0F2A4A" />
      <stop offset="100%" stop-color="#1B5BB5" />
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB020" />
      <stop offset="50%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Subtle Accent Ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#FFB020" stroke-opacity="0.18" stroke-width="6" />

  <!-- Saffron Wrench & Tool Glyph -->
  <g filter="url(#shadow)" transform="translate(256, 256) scale(1.15) translate(-256, -256)">
    <!-- Main Wrench (Rotated 45deg) -->
    <path
      d="M374.8 137.2c-29.2-29.2-76.6-29.2-105.8 0 -22.3 22.3-27.7 55.4-16.1 82.9l-114 114c-12.5 12.5-12.5 32.8 0 45.3 12.5 12.5 32.8 12.5 45.3 0l114-114c27.5 11.6 60.6 6.2 82.9-16.1 29.2-29.2 29.2-76.6 0-105.8l-37.4 37.4 -30.4-30.4 37.4-37.4c-0.1 0-75.9-75.9 75.9 75.9z"
      fill="url(#wrenchGrad)"
      transform="rotate(45 256 256)"
    />
  </g>

  <!-- Sparkle Accent -->
  <circle cx="380" cy="132" r="14" fill="#FFB020" opacity="0.9" />
  <circle cx="132" cy="380" r="10" fill="#FFB020" opacity="0.6" />
</svg>
